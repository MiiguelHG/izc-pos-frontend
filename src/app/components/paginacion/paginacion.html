<div>
    <div class="flex justify-end">
        <div class="flex items-center justify-between border-t border-white/10 px-4 py-3 sm:px-6">
            <div class="flex flex-1 justify-between sm:hidden">
                <button 
                    (click)="onPreviousClick($event)"
                    [disabled]="metaData()?.currentPage === 1"
                    class="relative inline-flex items-center rounded-md border border-white/10 bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:text-black hover:bg-white/50 disabled:opacity-50 disabled:cursor-not-allowed">Anterior</button>
                <button 
                    (click)="onNextClick($event)"
                    [disabled]="metaData()?.currentPage === metaData()?.totalPages"
                    class="relative ml-3 inline-flex items-center rounded-md border border-white/10 bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:text-black hover:bg-white/50 disabled:opacity-50 disabled:cursor-not-allowed">Siguiente</button>
            </div>
            <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between gap-x-4">
                <div>
                    <p class="text-sm text-gray-500 dark:text-gray-300">
                        Pág.
                        <span class="font-medium">{{ metaData()?.currentPage }}</span>
                        de
                        <span class="font-medium">{{ metaData()?.totalPages }}</span>
                        (<span class="font-medium">{{metaData()?.totalItems }}</span>
                        registros)
                    </p>
                </div>
                <div>
                    <nav aria-label="Pagination" class="isolate inline-flex -space-x-px rounded-md">
                        <button 
                            (click)="onPreviousClick($event)"
                            [disabled]="metaData()?.currentPage === 1"
                            [class.opacity-50]="metaData()?.currentPage === 1"
                            [class.cursor-not-allowed]="metaData()?.currentPage === 1"
                            class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-500 inset-ring 
                            inset-ring-gray-700 dark:inset-ring-gray-400 hover:bg-white hover:text-black focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Anterior</span>
                            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true"
                                class="size-5">
                                <path
                                    d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
                                    clip-rule="evenodd" fill-rule="evenodd" />
                            </svg>
                        </button>

                        @for (pagina of pages(); track $index) {
                          @if (pagina === '...') {
                            <span class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-400 inset-ring inset-ring-gray-700 dark:inset-ring-gray-400">
                              &hellip;
                            </span>
                          } @else {
                            <button 
                                (click)="onPageClick(pagina, $event)"
                                [class.bg-indigo-500]="pagina === metaData()?.currentPage"
                                [class.text-white]="pagina === metaData()?.currentPage" 
                                [class.text-gray-400]="pagina !== metaData()?.currentPage"
                                class="relative inline-flex items-center px-4 py-2 text-sm font-semibold inset-ring inset-ring-gray-700 dark:inset-ring-gray-400 hover:bg-white hover:text-black focus:z-20 focus:outline-offset-0 ">
                                {{ pagina }}
                            </button>
                          }
                        }

                        <button 
                            (click)="onNextClick($event)"
                            [disabled]="metaData()?.currentPage === metaData()?.totalPages"
                            [class.opacity-50]="metaData()?.currentPage === metaData()?.totalPages"
                            [class.cursor-not-allowed]="metaData()?.currentPage === metaData()?.totalPages"
                            class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 inset-ring inset-ring-gray-700 dark:inset-ring-gray-400 hover:bg-white hover:text-black focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Siguiente</span>
                            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true"
                                class="size-5">
                                <path
                                    d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
                                    clip-rule="evenodd" fill-rule="evenodd" />
                            </svg>
                        </button>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
