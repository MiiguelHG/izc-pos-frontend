@if (isRendered()) {
	<div
		[class]="containerClasses()"
		role="alert">
		<div class="inline-flex items-center justify-center shrink-0 w-6 h-6">
			@if (type() === 'success') {
				<svg
					[class]="iconClasses()"
					aria-hidden="true"
					xmlns="http://www.w3.org/2000/svg"
					fill="currentColor"
					viewBox="0 0 20 20"
				>
					<path
						d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"
					/>
				</svg>
			} @else {
				<svg
					[class]="iconClasses()"
					aria-hidden="true"
					xmlns="http://www.w3.org/2000/svg"
					fill="currentColor"
					viewBox="0 0 20 20"
				>
					<path
						d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"
					/>
				</svg>
			}
		</div>
		<div class="text-sm font-medium">
			{{ message() }}
		</div>
		<button
			type="button"
			(click)="onClose()"
			class="inline-flex items-center text-current hover:opacity-70 transition-opacity ml-2"
			[attr.aria-label]="'Cerrar notificación: ' + message()"
		>
			<svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
				<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12" />
			</svg>
		</button>
	</div>
}
