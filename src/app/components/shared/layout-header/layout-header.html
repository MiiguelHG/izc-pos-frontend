<header class="relative border-b border-gray-200 dark:border-gray-700">
  <!-- <div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-white/90 backdrop-blur-sm dark:bg-gray-900/90"></div> -->

  <div class="relative z-10 flex flex-col">
    <div class="flex flex-wrap py-3 items-center justify-center gap-3 text-center bg-gray-50 dark:bg-gray-800">
      <span class="inline-flex items-center rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-gray-700 dark:bg-gray-700 dark:text-gray-200">
        {{ roleLabel() }}
      </span>
      <h1 class="text-lg font-semibold text-gray-900 dark:text-white md:text-2xl">
        {{ headerTitle() }}
      </h1>
    </div>

    @if (breadcrumbItems().length > 0) {
      <div class="border-t border-gray-200/70 dark:border-gray-700/70">
        <nav aria-label="Breadcrumb">
          <div class="relative overflow-hidden">
            <div aria-hidden="true" class="pointer-events-none absolute inset-0 border border-gray-200/60 bg-gray-100/55 backdrop-blur-sm dark:border-gray-700/50 dark:bg-gray-800/45"></div>
            <!-- <div aria-hidden="true" class="pointer-events-none absolute inset-0 border border-gray-200/60  backdrop-blur-sm dark:border-gray-700/50 dark:bg-gray-800/45"></div> -->

            <ol class="relative flex flex-wrap items-center gap-y-1 px-3 py-1 text-sm text-gray-600 dark:text-gray-300">
              @for (crumb of breadcrumbItems(); track crumb.url; let last = $last) {
                <li class="flex items-center">
                  @if (!crumb.isCurrent) {
                    <a
                      [routerLink]="crumb.url"
                      class="rounded px-1 py-0.5 transition hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-300 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-600">
                      {{ crumb.label }}
                    </a>
                  } @else {
                    <span aria-current="page" class="px-1 py-0.5 font-medium text-gray-900 dark:text-white">
                      {{ crumb.label }}
                    </span>
                  }

                  @if (!last) {
                    <svg
                      aria-hidden="true"
                      class="mx-2 h-4 w-4 text-gray-400 dark:text-gray-500"
                      viewBox="0 0 20 20"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M7 4L13 10L7 16"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8" />
                    </svg>
                  }
                </li>
              }
            </ol>
          </div>
        </nav>
      </div>
    }
  </div>
</header>
