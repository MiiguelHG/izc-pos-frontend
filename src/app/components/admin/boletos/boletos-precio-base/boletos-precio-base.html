<!-- Botón que abre el modal para ver/editar el precio base -->
<div class="flex items-center">
	<button
		class="font-semibold rounded-lg cursor-pointer transition-all bg-blue-600 text-white px-4 py-2 border-b-4 border-blue-700 hover:brightness-110 hover:-translate-y-px active:border-b-0.5 active:brightness-90 active:translate-y-0.5"
		data-modal-target="precio-base-modal" data-modal-toggle="precio-base-modal" type="button">
		<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-3.866 0-7 1.79-7 4s3.134 4 7 4 7-1.79 7-4-3.134-4-7-4z" />
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v4" />
		</svg>
		Precio base
	</button>
</div>

<!-- Modal: Precio base del boleto -->
<div id="precio-base-modal" tabindex="-1" aria-hidden="true"
	class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
	<div class="relative p-4 w-full max-w-md max-h-full">
		<div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
			<div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
				<h3 class="text-lg font-semibold text-gray-900 dark:text-white">Precio base del boleto</h3>
				<button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="precio-base-modal">
					<svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
						<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
					</svg>
					<span class="sr-only">Close modal</span>
				</button>
			</div>

			<form class="p-4 md:p-5">
				<div class="mb-4">
          @defer (when boletoBase() !== null) {
            <p class="text-sm text-gray-600 dark:text-gray-300">Precio actual: <span class="font-semibold text-gray-900 dark:text-white">${{boletoBase()?.precioEstandar | number:'1.2-2'}}</span></p>
          }
				</div>

				<div class="mb-4">
					<label for="precioBase" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Actualizar precio base</label>
					<div class="relative">
						<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-lg">$</span>
						<input type="number" id="precioBase" name="precioBase" placeholder="0.00" min="0" step="0.01"
							class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full pl-8 pr-2.5 py-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" [formControl]="precio">
					</div>
				</div>

				<div class="flex justify-center p-4 md:p-5 gap-2">
					<button type="button" data-modal-toggle="precio-base-modal" class="text-white inline-flex items-center bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5">Cerrar</button>
					<button type="button" data-modal-toggle="precio-base-modal" class="text-white inline-flex items-center bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5" (click)="onSave()">Guardar</button>
				</div>
			</form>
		</div>
	</div>
</div>
