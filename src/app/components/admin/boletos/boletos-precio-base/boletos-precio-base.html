<!-- Botón que abre el modal para ver/editar el precio base -->
<div class="flex items-center">
	<button
		class="font-semibold rounded-lg cursor-pointer transition-all bg-blue-600 text-white px-4 py-2 border-b-4 border-blue-700 hover:brightness-110 hover:-translate-y-px active:border-b-0.5 active:brightness-90 active:translate-y-0.5"
		data-modal-target="precio-base-modal" data-modal-toggle="precio-base-modal" type="button">
		<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-2" fill="none" viewBox="0 0 24 24"
			stroke="currentColor">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
				d="M12 8c-3.866 0-7 1.79-7 4s3.134 4 7 4 7-1.79 7-4-3.134-4-7-4z" />
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v4" />
		</svg>
		Precio base
	</button>
</div>

<!-- Modal: Precio base del boleto -->
<div id="precio-base-modal" tabindex="-1" aria-hidden="true"
	class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
	<div class="relative p-4 w-full max-w-md max-h-full">
		<div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
			<div
				class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
				<h3 class="text-lg font-semibold text-gray-900 dark:text-white">Precio base del boleto</h3>
				<button type="button"
					class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
					data-modal-toggle="precio-base-modal">
					<svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
						viewBox="0 0 14 14">
						<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
					</svg>
					<span class="sr-only">Close modal</span>
				</button>
			</div>

			<form class="p-4 md:p-5">
				<div class="mb-4">
					@defer (when boletoBase() !== null) {
					<p class="text-sm text-gray-600 dark:text-gray-300">Precio actual: <span
							class="font-semibold text-gray-900 dark:text-white">${{boletoBase()?.precioEstandar |
							number:'1.2-2'}}</span></p>
					}
				</div>

				<div class="mb-4">
					<label for="precioBase"
						class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Actualizar precio
						base</label>
					<div class="relative">
						<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-lg">$</span>
						<input type="number" id="precioBase" name="precioBase" placeholder="0.00" min="0" step="0.01"
							class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full pl-8 pr-2.5 py-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
							[formControl]="precio">
					</div>
				</div>


				<div
					class="flex justify-center items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
					<button type="button" data-modal-toggle="precio-base-modal" (click)="onSave()"
						class="text-white inline-flex items-center bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
						<svg  class="me-1 -ms-1 w-5 h-5" fill="currentColor"
						xmlns="http://www.w3.org/2000/svg" id="Layer_1" data-name="Layer 1" viewBox="0 0 24 24">
							<path
								d="m13.27,7.48L20.077.673c.897-.897,2.353-.897,3.25,0s.897,2.353,0,3.25l-6.807,6.807c-.813.813-1.915,1.27-3.065,1.27h-1.455v-1.455c0-1.15.457-2.252,1.27-3.065Zm7.477,1.852l-2.813,2.813c-1.188,1.188-2.798,1.855-4.478,1.855h-2.455c-.552,0-1-.448-1-1v-2.455c0-.529.072-1.045.197-1.545h-5.197c-2.761,0-5,2.239-5,5v4c0,2.761,2.239,5,5,5h14c2.761,0,5-2.239,5-5v-4c0-2.14-1.359-3.956-3.254-4.668Zm-15.246,8.625c-.828,0-1.5-.672-1.5-1.5s.672-1.5,1.5-1.5,1.5.672,1.5,1.5-.672,1.5-1.5,1.5Zm5,0c-.828,0-1.5-.672-1.5-1.5s.672-1.5,1.5-1.5,1.5.672,1.5,1.5-.672,1.5-1.5,1.5Z" />
						</svg>
						Guardar
					</button>
					<button data-modal-hide="precio-base-modal" type="button" (click)="onCancel()"
						class="inline-flex items-center gap-2 py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-red-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
							stroke="currentColor" class="size-6">
							<path stroke-linecap="round" stroke-linejoin="round"
								d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
						</svg>
						Cancelar
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
