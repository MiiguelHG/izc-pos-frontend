<form action="" [formGroup]="informeForm" (ngSubmit)="onSubmit()">

  <div id="date-range-picker" date-rangepicker class="flex items-center">
    <div class="relative">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
        </svg>
      </div>
      <input id="datepicker-range-start" type="text" formControlName="startDate" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Select date start">
    </div>
  
    <span class="mx-4 text-gray-500">to</span>
  
    <div class="relative">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
        </svg>
      </div>
      <input id="datepicker-range-end" type="text" formControlName="endDate" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Select date end">
    </div>
  </div>
  
  <div class="grid sm:grid-cols-3 gap-4 mt-6">
    <div class="flex items-center px-4 border border-gray-200 rounded-sm dark:border-primary-dark">
        <input id="reportType-1" type="radio" value="visitantes" formControlName="reportType" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-primary-dark dark:border-gray-600">
        <label for="reportType-1" class="w-full py-4 ms-2 text-sm font-medium text-gray-900 dark:text-white">Visitantes</label>
    </div>
    <div class="flex items-center px-4 border border-gray-200 rounded-sm dark:border-primary-dark">
        <input id="reportType-2" type="radio" value="ingresos" formControlName="reportType" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-primary-dark dark:border-gray-600">
        <label for="reportType-2" class="w-full py-4 ms-2 text-sm font-medium text-gray-900 dark:text-white">Ingresos</label>
    </div>
  </div>

  <div class="grid sm:grid-cols-3 gap-4 mt-6">
    <div>
      <label for="museo" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Museo:</label>
      <select id="museo" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        <option selected disabled>Seleccione un museo</option>
        <option value="Todos">Todos</option>
        <option value="el_zacatecano">El Zacatecano</option>
        <option value="francisco_goitia">Francisco Goitia</option>
        <option value="manuel_felgueres">Manuel Felgueres</option>
        <option value="pedro_coronel">Pedro Coronel</option>
        <option value="rafael_coronel">Rafael Coronel</option>
        <option value="toma_de_zacatecas">Toma de Zacatecas</option>
  </select>
    </div>
  </div>

  <!-- <p>value: {{ informeForm.get('reportType')?.value }}</p> -->
  <!-- <p>value: {{ tipoInformeAcual() }}</p> -->
   <div class="mt-6">
      @if (tipoInformeAcual() === 'visitantes') {
        <app-formulario-visitantes></app-formulario-visitantes>
      }
      @else if (tipoInformeAcual() === 'ingresos') {
        <app-formulario-ingresos></app-formulario-ingresos>
      }
   </div>

  <hr class="border-gray-200 dark:border-primary-dark">

  <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 mt-6">Generar Informe</button>
  
</form>
