<div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
  <div>
    <label for="edad-min" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Edad mínima:</label>
    <input type="number" id="edad-min" aria-describedby="helper-text-explanation" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Ingrese edad mínima" required />
  </div>
  <div>
    <label for="edad-max" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Edad máxima:</label>
    <input type="number" id="edad-max" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white    dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Ingrese edad máxima" required />
  </div>
</div>

<div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
  <div>
    <label for="zip-input" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">código postal:</label> 
    <div class="relative">
      <div class="absolute inset-y-0 start-0 top-0 flex items-center ps-3.5 pointer-events-none">
        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 20">
            <path d="M8 0a7.992 7.992 0 0 0-6.583 12.535 1 1 0 0 0 .12.183l.12.146c.112.145.227.285.326.4l5.245 6.374a1 1 0 0 0 1.545-.003l5.092-6.205c.206-.222.4-.455.578-.7l.127-.155a.934.934 0 0 0 .122-.192A8.001 8.001 0 0 0 8 0Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>
        </svg>
      </div>
      <input type="text" id="zip-input" aria-describedby="helper-text-explanation" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="12345 or 12345-6789" pattern="^\d{5}(-\d{4})?$" required />
    </div>
  </div>

  <div>
    <label for="estado" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Estado:</label>
    <select id="estado" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
      <option selected disabled>Seleccione un estado</option>
      <option value="zacatecas">Zacatecas</option>
      <option value="aguascalientes">Aguascalientes</option>
      <option value="baja_california">Baja California</option>
      <option value="chihuahua">Chihuahua</option>
      <option value="estado_de_mexico">Estado de Mexico</option>
      <option value="jalisco">Jalisco</option>
      <option value="nuevo_leon">Nuevo Leon</option>
      <option value="puebla">Puebla</option>
      <option value="queretaro">Queretaro</option>
    </select>
  </div>

  <div>
    <label for="nacionalidad" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nacionalidad:</label>
    <select id="nacionalidad" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
      <option selected disabled>Seleccione una opción</option>
      <option value="nacional">Nacional</option>
      <option value="internacional">Internacional</option>
    </select>
  </div>
</div>

<div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
  <div>
    <label for="genero" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Género:</label>
    <select id="genero" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-primary-dark dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
      <option selected disabled>Seleccione un género</option>
      <option value="masculino">Masculino</option>
      <option value="femenino">Femenino</option>
      <option value="otro">Otro</option>
    </select>
  </div>
</div>
