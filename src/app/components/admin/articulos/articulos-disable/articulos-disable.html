<!-- BOTÓN DESHABILITAR -->
<button
  type="button"
  [attr.data-modal-target]="modalId()"
  [attr.data-modal-toggle]="modalId()"
  [class]="
    estaHabilitado()
    ? 'inline-flex items-center justify-center w-10 h-10 text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 rounded-full dark:bg-red-500 dark:hover:bg-red-600 dark:focus:ring-red-800'
    : 'inline-flex items-center justify-center w-10 h-10 text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 rounded-full dark:bg-green-500 dark:hover:bg-green-600 dark:focus:ring-green-800'
  ">

  <!-- ICONO -->
  @if (estaHabilitado()) {

  <!-- BASURA -->
  <svg xmlns="http://www.w3.org/2000/svg"
       class="w-5 h-5"
       fill="none"
       viewBox="0 0 24 24"
       stroke="currentColor">
    <path stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 7h12M9 7V4h6v3m-8 0h10l-1 12H8L7 7z"/>
  </svg>

  } @else {

  <!-- OJO -->
  <svg xmlns="http://www.w3.org/2000/svg"
       class="w-5 h-5"
       fill="none"
       viewBox="0 0 24 24"
       stroke="currentColor">
    <path stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    <path stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7
          c-1.274 4.057-5.065 7-9.542 7s-8.268-2.943-9.542-7z"/>
  </svg>

  }

</button>


<!-- MODAL CONFIRMAR -->
<div
  [id]="modalId()"
  tabindex="-1"
  aria-hidden="true"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50
         justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)]">

  <div class="relative p-4 w-full max-w-md max-h-full">

    <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">

      <!-- HEADER -->
      <div class="flex items-center justify-between p-4 border-b dark:border-gray-600">

        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
          Confirmar acción
        </h3>

        <button
          type="button"
          [attr.data-modal-hide]="modalId()"
          class="text-gray-400 hover:text-gray-900 dark:hover:text-white">
          ✕
        </button>

      </div>

      <!-- BODY -->
      <div class="p-6 text-center">

        <p class="text-gray-700 dark:text-gray-300">
            @if (estaHabilitado()) {
                ¿Estás seguro de que deseas deshabilitar este artículo?
            } @else {
                ¿Deseas habilitar nuevamente este artículo?
            } 
        </p>

      </div>

      <!-- FOOTER -->
      <div class="flex justify-center gap-4 pb-6">

        <button
        (click)="confirmar()"
        [attr.data-modal-hide]="modalId()"
        [class]="
        estaHabilitado()
        ? 'text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-5 py-2.5'
        : 'text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-5 py-2.5'
        ">

        @if (estaHabilitado()) {
            Deshabilitar
        } @else {
            Habilitar
        }

        </button>

        <button
          type="button"
          [attr.data-modal-hide]="modalId()"
          class="bg-gray-300 hover:bg-gray-400 text-gray-900
                 font-medium rounded-lg text-sm px-5 py-2.5">
          Cancelar
        </button>

      </div>

    </div>

  </div>
</div>
