<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
  <!-- Header -->
  <div class="bg-white text-center dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4">
    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">Servicios</h2>
  </div>
  <div class="relative">
    <div class="flex bg-primary-light dark:bg-gray-900 py-2 px-6 justify-between border-b border-gray-200 dark:border-gray-700">
      <div>
        <label for="search-servicios" class="block mb-2.5 text-sm font-medium text-heading sr-only ">search</label>
        <div class="relative">
          <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
              <svg class="w-4 h-4 text-body text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2.3" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
              </svg>
          </div>
          <input type="search-servicios" id="search-servicios" class="block p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Buscar por servicio" required />
        </div>
      </div>

      <div>
        <app-servicios-create (agreeToCreate)="createServicio($event)" />
      </div>

    </div>
  </div>

  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-thirdary-light dark:bg-secondary-dark dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">ID</th>
        <th scope="col" class="px-6 py-3">Servicio</th>
        <th scope="col" class="px-6 py-3">Precio</th>
        <th scope="col" class="px-6 py-3">Descuento</th>
        <th scope="col" class="px-6 py-3">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (servicio of servicios(); track servicio.id) {
      <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
          {{servicio.id}}
        </th>
        <td class="px-6 py-4">{{servicio.nombre}}</td>
        <td class="px-6 py-4">{{servicio.precio}}</td>
        <td class="px-6 py-4">{{servicio.descuento}}</td>
        <td class="px-6 py-4 flex gap-2">
          <app-servicios-edit [servicio]="servicio" (agreeToUpdate)="updateServicio($event)" />
          <app-servicios-delete [servicio]="servicio" (agreeToDelete)="deleteServicio(servicio.id)" />
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<div class="mt-4 flex justify-center items-center">
  <app-paginacion [TotalResultado]="servicios().length" [Solo10]="10" [PagActual]="1"></app-paginacion>
</div>
