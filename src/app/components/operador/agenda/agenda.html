<div class="space-y-6 p-4">

  <!-- Botón -->
  <div class="w-full">
    <app-registrar-evento></app-registrar-evento>
  </div>

  <!-- Calendario -->
  <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>

</div>
<!-- Modal flotante sobre el calendario -->
<div
  *ngIf="modalAbierto"
  class="fixed inset-0 z-50 flex items-start justify-center bg-black/30"
>
  <div
    class="mt-20 w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-200"
  >
    <!-- Header -->
    <div class="flex justify-between items-center border-b p-4">
      <h3 class="text-lg font-semibold text-gray-800">
        Eventos del {{ fechaSeleccionada }}
      </h3>
      <button
        (click)="cerrarModal()"
        class="text-gray-400 hover:text-gray-600 transition"
      >
        ✕
      </button>
    </div>

    <!-- Lista de eventos -->
    <div class="p-4 space-y-3 max-h-[60vh] overflow-y-auto">
      <ng-container *ngIf="eventosDia.length > 0; else sinEventos">
        <div
          *ngFor="let evento of eventosDia"
          class="border rounded-lg p-3 hover:bg-gray-50 transition"
        >
          <h4 class="text-base font-semibold text-gray-800">
            {{ evento.title }}
          </h4>
        
        <div class="mt-8 flex justify-between items-center">

          <p class="text-sm text-gray-600">
            {{ evento.start | date: 'shortTime' }} — {{ evento.end | date: 'shortTime' }}
          </p>
          <div class="flex items-center space-x-2">
            <button
              type="button"
              class="inline-flex items-center justify-center w-10 h-10 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 rounded-full dark:bg-blue-500 dark:hover:bg-blue-600 dark:focus:ring-blue-800 transition-colors"
              >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            
            </button>
            <button
              type="button"
               class="inline-flex items-center justify-center w-10 h-10 text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 rounded-full dark:bg-red-500 dark:hover:bg-red-600 dark:focus:ring-red-800 transition-colors"
              >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
            
        </div>

        </div>
      </ng-container>

      <ng-template #sinEventos>
        <p class="text-gray-500 text-center italic">
          No hay eventos registrados para este día.
        </p>
      </ng-template>
    </div>

    <!-- Footer -->
    <div class="flex justify-end border-t p-3">
      <button
        (click)="cerrarModal()"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition"
      >
        Cerrar
      </button>
    </div>
  </div>
</div>
