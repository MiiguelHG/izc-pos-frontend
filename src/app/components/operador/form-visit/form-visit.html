<!--form-visit.html-->
<form [formGroup]="FormVisitante" class="p-4 md:p-2">

    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white flex justify-center mb-12">Registro De Visitantes
    </h2>


    <div class="grid grid-flow-col auto-cols-max gap-x-12 mb-6 items-centers justify-center">

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Visitante
            </label>
            <input type="text" formControlName="nombre" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-88
                p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Nombre del visitante" required>
        </div>


        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Edad
            </label>
            <input type="number" formControlName="edad" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                focus:ring-primary-600 focus:border-primary-600 block w-20 px-3 py-2.5
                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="150"
                placeholder="00" required>
        </div>

        <div class="max-w-sm mx-auto">
            <label for="grupo" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">¿Es un
                grupo?</label>
            <select id="grupo" formControlName="grupo" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-72
                p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                <option value="No">No</option>
                <option value="Sí">Sí</option>>

            </select>
        </div>

    </div>

    <div class="grid grid-flow-col auto-cols-max gap-x-12 mb-12 items-centers justify-center">
        <div class="max-w-sm mx-auto">
            <label for="pais" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">Selecciona un
                país</label>
            <select id="pais" formControlName="pais" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-72
                p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                <option value="" disabled selected>Elije un país</option>
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="FR">France</option>
                <option value="DE">Germany</option>
            </select>
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                CP
            </label>
            <input type="text" formControlName="cp" maxlength="5" inputmode="numeric" pattern="\d*" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                focus:ring-primary-600 focus:border-primary-600 block w-24 p-2.5
                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="12345"
                required>
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Estado
            </label>
            <input type="text" formControlName="estado" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-72
                p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="ejemp: Zacatecas" required>
        </div>



    </div>


    <div class="grid grid-flow-col auto-cols-max gap-x-12 mb-6 items-centers justify-center">

    <!-- Este select DESAPARECE cuando grupo es "Sí" -->
    <div class="max-w-sm mx-auto" *ngIf="FormVisitante.get('grupo')?.value === 'No'">
        <label for="un_genero" class="block mb-2.5 text-sm font-medium text-heading dark:text-white flex justify-center">
            Selecciona el genero
        </label>
        <select formControlName="un_genero" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
            rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-72
            p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
            dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500
            text-center">
            <option value="" disabled selected>Elije un genero</option>
            <option value="hhombre">Hombre</option>
            <option value="mmujer">Mujer</option>
            <option value="ootro">Otro</option>
        </select>
    </div>

    <!-- Estos campos APARECEN cuando grupo es "Sí" -->
    <ng-container *ngIf="FormVisitante.get('grupo')?.value === 'Sí'">
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Cantidad de hombres
            </label>
            <input type="number" formControlName="hombre" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                focus:ring-primary-600 focus:border-primary-600 block w-20 px-3 py-2.5
                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="1000"
                placeholder="00">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Cantidad de mujeres
            </label>
            <input type="number" formControlName="mujer" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                focus:ring-primary-600 focus:border-primary-600 block w-20 px-3 py-2.5
                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="1000"
                placeholder="00">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Cantidad de otro genero
            </label>
            <input type="number" formControlName="otrogenero" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                focus:ring-primary-600 focus:border-primary-600 block w-20 px-3 py-2.5
                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="1000"
                placeholder="00">
        </div>
    </ng-container>

    <div>
        <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Total de visitantes
        </label>
        <input type="text" formControlName="totalvisitantes" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
            focus:ring-primary-600 focus:border-primary-600 block w-20 px-3 py-2.5
            dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
            dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 text-center" placeholder="0">
    </div>
</div>



</form>

<pre>{{ FormVisitante.value | json }}</pre>
<pre>Status: {{ FormVisitante.status }}</pre>
