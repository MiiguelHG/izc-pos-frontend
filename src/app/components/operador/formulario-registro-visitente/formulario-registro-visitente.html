<!--form-visit.html-->
<div class="flex flex-col md:mx-12 md:my-6 bg-white dark:bg-primary-dark rounded-lg p-6 shadow-md">

    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white flex justify-center mb-6">Registro De Visitantes
    </h2>

    <form [formGroup]="formVisitante" (submit)="onRegistrarVisitante()">
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">

            <div class="">
                <label for="grupo" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">¿Es un
                    grupo?</label>
                <select id="grupo" (change)="cambiarTipoGrupo($event)" [value]="esGrupo() ? 'Sí' : 'No'" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                    <option value="No">No</option>
                    <option value="Sí">Sí</option>
        
                </select>
            </div>
        </div>
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
            
            <div class="col-span-2">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Visitante
                </label>
                <input type="text" formControlName="nombre" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Nombre del visitante" required>
            </div>
    
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Edad
                </label>
                <input type="number" formControlName="edad" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="150"
                    placeholder="Ingrese edad" required>
            </div>
    
    
        </div>
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
            <div class="">
                <label for="pais" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">Selecciona un
                    país</label>
                <select id="pais" formControlName="pais" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                    <option value="" disabled selected>Elije un país</option>
                    <option value="US">United States</option>
                    <option value="CA">Canada</option>
                    <option value="FR">France</option>
                    <option value="DE">Germany</option>
                </select>
            </div>
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    CP
                </label>
                <input type="text" formControlName="cp" maxlength="5" inputmode="numeric" pattern="\d*" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="12345"
                    required>
            </div>
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Estado
                </label>
                <input type="text" formControlName="estado" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="ejemp: Zacatecas" required>
            </div>
    
    
    
        </div>
    
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
    
        <!-- Este select DESAPARECE cuando grupo es "Sí" -->
         @if( !esGrupo() ) {
        <div>
            <label for="un_genero" class="block mb-2.5 text-sm font-medium text-heading dark:text-white justify-center">
                Selecciona el genero
            </label>
            <select (change)="actualizarVisitante($event)" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500
                text-center">
                <option value="" disabled selected>Elige un genero</option>
                <option value="hombre">Hombre</option>
                <option value="mujer">Mujer</option>
                <option value="otro">Otro</option>
            </select>
        </div>
        } @else {
        <!-- Estos campos APARECEN cuando grupo es "Sí" -->
        
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Cantidad de hombres
                </label>
                <input type="number" formControlName="cantidadHombres" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="1000"
                    placeholder="00">
            </div>
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Cantidad de mujeres
                </label>
                <input type="number" formControlName="cantidadMujeres" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="1000"
                    placeholder="00">
            </div>
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Cantidad de otro genero
                </label>
                <input type="number" formControlName="cantidadOtros" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="1000"
                    placeholder="00">
            </div>
        }
        </div>
    
        <button type="submit" [class]="'bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500' + (this.formVisitante.status === 'INVALID' ? ' opacity-50 cursor-not-allowed' : '')">
            Registrar Visitante
        </button>
    </form>

    </div> -->
</div>
