<!--form-visit.html-->
<div class="flex flex-col md:mx-12 md:my-6 bg-white dark:bg-primary-dark rounded-lg p-6 shadow-md">

    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white flex justify-center mb-6">Registro De Visitantes
    </h2>

    <app-notificacion-cortesia (invitado)="onInvitadoId($event)"/>

    @if (cortesiaActiva() && invitado()) {
        <section class="mb-6 flex flex-col gap-2 rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-green-800 shadow-sm dark:border-green-700 dark:bg-green-900/30 dark:text-green-200">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-green-200 text-green-800 dark:bg-green-900/60 dark:text-green-200">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 6 9 17l-5-5"></path>
                        </svg>
                    </span>
                    <div>
                        <p class="text-sm font-semibold">Cortesia activa</p>
                        <p class="text-xs">Se aplicará a: <span class="font-semibold">{{ invitado()?.nombre }}</span></p>
                    </div>
                </div>
                <button type="button" class="rounded-lg border border-green-600 px-3 py-1.5 text-xs font-semibold text-green-700 transition hover:bg-green-100 dark:border-green-400 dark:text-green-200 dark:hover:bg-green-900/50" (click)="onLimpiarCortesia()">
                    Cancelar cortesia
                </button>
            </div>
        </section>
    }

    <form [formGroup]="formVisitante" (submit)="onRegistrarVisitante()">
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
            <div>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" [formControl]="isGroup">
                    <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-300 dark:peer-focus:ring-green-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-0.5 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-green-600"></div>
                    <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">¿Es un grupo?</span>
                </label>
            </div>
        </div>
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
            
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Visitante
                </label>
                <input type="text" formControlName="nombre" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Nombre del visitante" required>
            </div>
    
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Edad
                </label>
                <input type="number" formControlName="edad" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="1" max="150"
                    placeholder="Ingrese edad" required>
            </div>
            
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    CP
                </label>
                <input type="text" formControlName="cp" maxlength="5" inputmode="numeric" pattern="\d*" 
                (blur)="onCpBlur()"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5
                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="12345"
                required>
            </div>
    
        </div>
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
            
            <div>
                <label for="pais" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">Selecciona un
                    país</label>
                <select id="pais" formControlName="pais" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                    <option value="" disabled selected>Elije un país</option>
                    <option value="MX">Mexico</option>
                    <option value="US">United States</option>
                    <option value="CA">Canada</option>
                    <option value="FR">France</option>
                    <option value="DE">Germany</option>
                </select>
            </div>

            <div>

                <label for="estado" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">Selecciona un
                    estado</label>
                <select id="estado" formControlName="estado" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                    <option value="" disabled selected>Elije un estado</option>
                    @defer (when estados.hasValue()) {
                        @for (estado of estados.value()?.data; track estado.ESTADO_ID) {
                            <option [value]="estado.EDO1">{{ estado.ESTADO }}</option>
                        }
                    } @placeholder {
                        <option value="">Cargando estados...</option>
                    }
                </select>
            </div>
    
            <div>
                <label for="municipio" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">Ingresa un municipio</label>
                <input type="text" formControlName="municipio" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                    rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                    p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Ingresa un municipio">
            </div>
    
        </div>
    
    
        <div class="grid gap-3 md:gap-6 mb-6 sm:grid-cols-2 md:grid-cols-3">
    
        <!-- Este select DESAPARECE cuando grupo es "Sí" -->
         @if( !isGroup.value ) {
        <div>
            <label for="unVisitante" class="block mb-2.5 text-sm font-medium text-heading dark:text-white justify-center">
                Selecciona el genero
            </label>
            <select  id="unVisitante" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm 
                rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full
                p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500
                text-center" [formControl]="unVisitante">
                <option value="" disabled selected>Elige un genero</option>
                <option value="hombre">Hombre</option>
                <option value="mujer">Mujer</option>
                <option value="otro">Otro</option>
            </select>
        </div>
        } @else {
        <!-- Estos campos APARECEN cuando grupo es "Sí" -->
        
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Cantidad de hombres
                </label>
                <input type="number" formControlName="cantidadHombres" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="0" max="1000"
                    placeholder="00">
            </div>
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Cantidad de mujeres
                </label>
                <input type="number" formControlName="cantidadMujeres" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="0" max="1000"
                    placeholder="00">
            </div>
    
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Cantidad de otro genero
                </label>
                <input type="number" formControlName="cantidadOtros" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                    focus:ring-primary-600 focus:border-primary-600 block w-full px-3 py-2.5
                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 
                    dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" min="0" max="1000"
                    placeholder="00">
            </div>
        }
        </div>
    
        <button type="submit" [class]="'bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500' + (this.formVisitante.status === 'INVALID' ? ' opacity-50 cursor-not-allowed' : '')">
            Registrar Visitante
        </button>
    </form>
</div>
