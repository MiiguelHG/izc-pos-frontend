<!-- boletos-formulario.html -->
<app-form-visit (formStatusChange)="onFormStatusChange($event)" />

<div class="grid grid-flow-col auto-cols-max gap-x-12 mb-6 items-centers justify-center">
    

    <button 
        type="button"  
        [disabled]="!formularioValido"
        (click)="continue()" 
        class="font-semibold rounded-lg cursor-pointer transition-all bg-green-500 text-white px-6 py-2 rounded-lg 
               border-green-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px]
               active:border-b-[2px] active:brightness-90 active:translate-y-[2px]
               disabled:bg-gray-400 disabled:border-gray-500 disabled:cursor-not-allowed disabled:hover:brightness-100 disabled:hover:translate-y-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 inline-block mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Continuar
    </button>


</div>
