@let localUser = user();
@defer (when localUser !== null) {

<aside id="default-sidebar"
   class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform lg:translate-x-0"
   [class.-translate-x-full]="!isSidebarOpen()"
   [class.translate-x-0]="isSidebarOpen()"
   aria-label="SidebarOperador">
   <div class="h-full px-3 py-4 bg-primary-light dark:bg-gray-800 flex flex-col border-e-2 border-gray-200 dark:border-gray-600">
      <ul class="space-y-2 font-medium flex-1 overflow-y-auto">
         <li>
            <a routerLink="productosventa" routerLinkActive="bg-gray-100 dark:bg-gray-700" 
               class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
               <svg xmlns="http://www.w3.org/2000/svg" 
               class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
               width="24" height="24" viewBox="0 0 24 24" 
               stroke-width="2" stroke="currentColor" fill="none" 
               stroke-linecap="round" stroke-linejoin="round">
               <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
               <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
               <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
               <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2 -1.61l1.6 -8.39h-15.32" />
               </svg>
               <span class="flex-1 ms-3 whitespace-nowrap">Articulos</span>
            </a>
         </li>
         <li>
            <!--TODO: Modificar esta ruta -->
            <a routerLink="boletos" routerLinkActive="bg-gray-100 dark:bg-gray-700" 
               class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"
                  class="icon icon-tabler icons-tabler-outline icon-tabler-ticket shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M15 5l0 2" />
                  <path d="M15 11l0 2" />
                  <path d="M15 17l0 2" />
                  <path
                     d="M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-3a2 2 0 0 0 0 -4v-3a2 2 0 0 1 2 -2" />
               </svg>
               <span class="flex-1 ms-3 whitespace-nowrap">Boletos</span>
            </a>
         </li>
         <li>
            <a [routerLink]="['agendar']" routerLinkActive="bg-gray-100 dark:bg-gray-700"
               class="transform transition  focus:scale-95
            flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"
                  class="icon icon-tabler icons-tabler-outline icon-tabler-calendar shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z" />
                  <path d="M16 3v4" />
                  <path d="M8 3v4" />
                  <path d="M4 11h16" />
                  <path d="M11 15h1" />
                  <path d="M12 15v3" />
               </svg>
               <span class="flex-1 ms-3 whitespace-nowrap">Agendar</span>
            </a>
         </li>
      </ul>

      <footer class="mt-auto pt-4 border-t border-gray-200 dark:border-neutral-700">
         <div class="relative">
            <button id="dropdownDefaultButton" (click)="toggleUserDropdown()" [attr.aria-expanded]="isUserDropdownOpen()"
               class="text-black dark:text-white hover:bg-secondary-light dark:hover:bg-secondary-dark focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-md w-full p-2 text-center inline-flex items-center dark:focus:ring-pribg-primary-dark gap-2"
               type="button">
               <app-user-avatar [nombre]="localUser?.nombre!"></app-user-avatar>
               <span class="flex-1 text-left">{{localUser?.nombre}}</span>
               <svg class="w-6 h-6 ms-auto transition-transform duration-200" [class.rotate-180]="isUserDropdownOpen()" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 20 20">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="m6 8 4 4 4-4" />
               </svg>
            </button>

            <!-- Dropdown menu -->
            <div id="dropdown"
               class="absolute bottom-full mb-2 left-0 right-0 z-20 bg-secondary-light divide-y divide-secondary-light rounded-lg shadow-md dark:bg-secondary-dark transition-all duration-200 ease-out origin-bottom"
               [class.opacity-0]="!isUserDropdownOpen()"
               [class.scale-95]="!isUserDropdownOpen()"
               [class.translate-y-1]="!isUserDropdownOpen()"
               [class.pointer-events-none]="!isUserDropdownOpen()"
               [class.invisible]="!isUserDropdownOpen()">
               <ul class="py-2 text-sm text-secondary-dark dark:text-gray-200" aria-labelledby="dropdownDefaultButton">
                  <li>
                     <button (click)="toggleTheme()"
                        class="w-full flex items-center px-4 py-2 text-sm text-secondary-dark hover:bg-gray-200 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white rounded-t-lg"
                        role="menuitem">
                        @if (themeService.isDarkMode()) {
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                           class="icon icon-tabler icons-tabler-outline icon-tabler-sun">
                           <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                           <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                           <path
                              d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                        </svg>
                        <span class="ms-3 whitespace-nowrap">Modo claro</span>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                           class="icon icon-tabler icons-tabler-outline icon-tabler-moon">
                           <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                           <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
                        </svg>
                        <span class="ms-3 whitespace-nowrap">Modo oscuro</span>
                        }
                     </button>
                  </li>
                  <li>
                     <button
                        class="w-full flex items-center px-4 py-2 text-sm text-secondary-dark hover:bg-gray-200 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white rounded-b-lg"
                        role="menuitem" (click)="onLogOut()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                           class="icon icon-tabler icons-tabler-outline icon-tabler-logout">
                           <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                           <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                           <path d="M9 12h12l-3 -3" />
                           <path d="M18 15l3 -3" />
                        </svg>
                        <span class="ms-3 whitespace-nowrap">Cerrar sesión</span></button>
                  </li>
               </ul>
            </div>
         </div>
      </footer>
   </div>
</aside>

<div class="lg:ml-64 flex flex-col min-h-screen">
   <div class="fixed top-0 left-0 right-0 z-30 lg:left-64">
      <div class="flex flex-row m-0 p-0 w-full">
         <button aria-controls="default-sidebar"
            type="button"
            (click)="toggleSidebar()"
            [attr.aria-expanded]="isSidebarOpen()"
            class="inline-flex items-center py-2 px-4 text-sm bg-primary-light dark:bg-gray-800 text-gray-500 lg:hidden hover:bg-secondary-light focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-900 dark:focus:ring-gray-600">
            <span class="sr-only">Open sidebar</span>
            <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
               <path clip-rule="evenodd" fill-rule="evenodd"
                  d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z">
               </path>
            </svg>
         </button>

      @if (isSidebarOpen()) {
      <button type="button" aria-label="Cerrar sidebar" class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="closeSidebar()"></button>
      }
         <app-layout-header class="block w-full flex-1 min-w-0"></app-layout-header>
      </div>
   </div>
  <main class="flex-1 px-8 pb-6 pt-24">
    <router-outlet/>
  </main>
  <app-footer></app-footer>
</div>
} @placeholder {
<div class="fixed inset-0 z-50 bg-gray-900/50 dark:bg-gray-900/50">
   <div role="status" class="absolute -translate-x-1/2 -translate-y-1/2 top-2/4 left-1/2">
      <svg aria-hidden="true" class="h-8 w-8 text-neutral-tertiary animate-spin fill-brand" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/><path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/></svg>
         <span class="sr-only">Loading...</span>
   </div>
</div>
}
